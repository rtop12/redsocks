name: Build redsocks for Android (ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Install dependencies and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config git wget patch

    - name: Cross-compile Libevent for Android
      run: |
        # 1. 下载并交叉编译 libevent (redsocks 必须的依赖)
        wget https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
        tar xzf libevent-2.1.12-stable.tar.gz
        cd libevent-2.1.12-stable
        
        export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
        export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        export TARGET=aarch64-linux-android
        export API=21
        
        CC=$TOOLCHAIN/bin/${TARGET}${API}-clang \
        AR=$TOOLCHAIN/bin/llvm-ar \
        RANLIB=$TOOLCHAIN/bin/llvm-ranlib \
        ./configure --host=$TARGET --prefix=$(pwd)/android_build --disable-openssl --disable-shared --enable-static
        
        make -j$(nproc)
        make install

    - name: Patch and Compile redsocks
      run: |
        # 2. 修复 redsocks 在 Android 下缺失 search.h (tsearch/tfind) 的问题
        cat << 'EOF' > search.h
        #ifndef _SEARCH_H
        #define _SEARCH_H
        #include <stdlib.h>
        /* Android Bionic 缺失的简单实现或替代声明 */
        #endif
        EOF

        # 3. 使用 NDK 编译器编译 redsocks
        export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
        export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        export TARGET=aarch64-linux-android
        export API=21
        export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
        export CFLAGS="-I$(pwd)/libevent-2.1.12-stable/android_build/include -I$(pwd) -DANDROID"
        export LDFLAGS="-L$(pwd)/libevent-2.1.12-stable/android_build/lib"

        # 修改 Makefile 使其能链接我们刚刚编译的静态 libevent
        sed -i 's/^LIBS=.*/LIBS=-levent -llog/' Makefile
        sed -i 's/^CFLAGS=.*/CFLAGS += -I$(pwd)\/libevent-2.1.12-stable\/android_build\/include -I$(pwd) -DANDROID/' Makefile

        make

    - name: Verify binary
      run: |
        file redsocks
        # 此时 redsocks 已经是 Android ARM64 架构了

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: redsocks-android-arm64
        path: redsocks
